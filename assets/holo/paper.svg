<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Granular cardstock: mid-grey noise for overlay blending (no average shift), plus short fibres. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".92" numOctaves="3" seed="11" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="1.9" intercept="-.45"/><feFuncG type="linear" slope="1.9" intercept="-.45"/><feFuncB type="linear" slope="1.9" intercept="-.45"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
  </filter>
  <rect width="160" height="160" filter="url(#grain)"/>
  <g fill="none" stroke-linecap="round" stroke-width=".55">
    <path stroke="#fff" opacity=".55" d="M14 22q6-3 11 1M61 9q5 4 3 9M118 18q7-1 10 4M34 61q2 6 8 7M92 48q6-2 9 3M141 66q-3 5 1 10M8 104q6 1 8 6M57 97q4-4 10-3M108 92q2 6-1 10M136 121q5 2 9-2M28 141q6-2 9 2M79 133q3 5 9 5M123 149q4-4 10-4"/>
    <path stroke="#000" opacity=".35" d="M44 34q5 2 7 7M102 31q-2 5 2 9M147 39q4 4 3 9M17 76q5-3 10-1M73 71q5 3 6 8M125 82q5-3 10 0M41 118q3-5 9-5M95 116q5 2 6 7M150 102q-5 3-5 8M64 151q4-3 9-2"/>
  </g>
</svg>
